<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OneUserApps</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text x='50' y='75' font-size='80' text-anchor='middle' fill='%23222' font-family='serif'>1</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300..600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            position: relative;
            min-height: 100svh;
            overflow: hidden;
            display: flex;
            align-items: center;
            padding: 30px 8%;
            isolation: isolate;
            color: #171713;
            background-color: #fafafa;
            background-image: radial-gradient(
                circle,
                rgba(23, 23, 19, 0.08) 0 0.75px,
                transparent 0.9px
            );
            background-size: 10px 10px;
            background-position: center;
            font-family: "Outfit", sans-serif;
        }

        .background {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .background canvas {
            display: block;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 1100ms ease;
        }

        .background.is-rendered canvas {
            opacity: 1;
        }

        main {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 960px;
            margin: auto;
        }

        h1 {
            font-size: clamp(36px, 5vw, 64px);
            line-height: 1;
            font-weight: 400;
        }

        p {
            /* Optical alignment: the small "S" needs a nudge right to sit
               flush with the round "O" above it. */
            margin: 6px 0 0 0.18em;
            color: #6f6f69;
            font-size: clamp(12px, 1.3vw, 15px);
            line-height: 1.5;
            letter-spacing: 0.075em;
        }
    </style>
</head>
<body>
    <div class="background" aria-hidden="true">
        <canvas></canvas>
    </div>

    <main>
        <h1>OneUserApps</h1>
        <p>Somewhere between minimal and zero</p>
    </main>

    <script>
        (() => {
            const background = document.querySelector(".background");
            const canvas = background.querySelector("canvas");

            // OneUserApps: O, U and A drawn as a circle, a U (rectangle
            // on a semicircle) and a triangle. x, y are viewport fractions;
            // r and drift are fractions of viewport height. sx / sy / sr are
            // angular speeds in rad/s; rot is the resting tilt in radians.
            const shapes = [
                { kind: "circle", rot: 0.00,
                  x: 0.22, y: 0.32, r: 0.42, depth: 0.6,
                  drift: 0.055, sx: 0.14, sy: 0.11, sr: 0.09, phase: 0.0 },
                { kind: "u", rot: -0.15,
                  x: 0.52, y: 0.66, r: 0.42, depth: 0.85,
                  drift: 0.060, sx: 0.10, sy: 0.13, sr: 0.08, phase: 3.1 },
                { kind: "triangle", rot: 0.20,
                  x: 0.80, y: 0.36, r: 0.42, depth: 1.1,
                  drift: 0.065, sx: 0.12, sy: 0.15, sr: 0.11, phase: 1.7 }
            ];
            const shapeCount = shapes.length;
            const kindIds = { circle: 0, u: 1, triangle: 2 };
            // Relative to a shape's size r: the U's straight sides, the
            // triangle's half side and the corner rounding.
            const uSide = 1.3;
            const triangleHalf = 0.95;
            const cornerRadius = 0.14;
            const inkColor = "rgba(31, 31, 26, 0.12)";

            const gl = canvas.getContext("webgl2", {
                alpha: true,
                antialias: false,
                depth: false,
                powerPreference: "low-power",
                premultipliedAlpha: false
            });
            let glProgram = null;
            let shapesLocation = null;
            let deviceScaleLocation = null;
            let fallback = null;
            const shapeUniforms = new Float32Array(shapeCount * 4);

            if (gl) {
                const vertexSource = `#version 300 es
                    in vec2 a_position;

                    void main() {
                        gl_Position = vec4(a_position, 0.0, 1.0);
                    }
                `;

                const fragmentSource = `#version 300 es
                    precision highp float;

                    // xy = centre, z = size, w = rotation.
                    uniform vec4 u_shapes[${shapeCount}];
                    uniform float u_deviceScale;

                    const int KINDS[${shapeCount}] = int[](
                        ${shapes.map((shape) => kindIds[shape.kind]).join(", ")}
                    );

                    out vec4 fragColor;

                    float softMin(float a, float b, float k) {
                        float h = clamp(
                            0.5 + 0.5 * (b - a) / k,
                            0.0,
                            1.0
                        );
                        return mix(b, a, h) - k * h * (1.0 - h);
                    }

                    const float U_SIDE = ${uSide.toFixed(3)};
                    const float TRIANGLE_HALF = ${triangleHalf.toFixed(3)};
                    const float CORNER = ${cornerRadius.toFixed(3)};

                    // Sharp U: sides at |x| = r up to y = top, closed
                    // below by a semicircle centred at (0, c).
                    float sdSharpU(vec2 p, float r, float top, float c) {
                        p.x = abs(p.x);

                        if (p.y > top) {
                            return length(vec2(max(p.x - r, 0.0), p.y - top));
                        }

                        if (p.y >= c) {
                            return max(p.x - r, p.y - top);
                        }

                        return max(length(p - vec2(0.0, c)) - r, p.y - top);
                    }

                    // U centred on its bounding box, with its top corners
                    // rounded by shrinking the shape and growing it back.
                    float sdU(vec2 p, float r) {
                        float k = CORNER * r;
                        float top = 0.5 * (1.0 + U_SIDE) * r;
                        float c = top - U_SIDE * r;
                        return sdSharpU(p, r - k, top - k, c) - k;
                    }

                    // Point-up equilateral triangle centred on its
                    // centroid; r is half the side length.
                    float sdTriangle(vec2 p, float r) {
                        const float k = sqrt(3.0);
                        p.x = abs(p.x) - r;
                        p.y = p.y + r / k;

                        if (p.x + k * p.y > 0.0) {
                            p = vec2(p.x - k * p.y, -k * p.x - p.y) / 2.0;
                        }

                        p.x -= clamp(p.x, -2.0 * r, 0.0);
                        return -length(p) * sign(p.y);
                    }

                    float sdShape(int kind, vec2 p, float r) {
                        if (kind == 1) {
                            return sdU(p, r);
                        }

                        if (kind == 2) {
                            // Inset so the rounded edges stay in place.
                            float k = CORNER * r;
                            return sdTriangle(
                                p,
                                TRIANGLE_HALF * r - k * sqrt(3.0)
                            ) - k;
                        }

                        return length(p) - r;
                    }

                    void main() {
                        vec2 point = gl_FragCoord.xy / u_deviceScale;
                        float field = 1e6;

                        for (int i = 0; i < ${shapeCount}; i++) {
                            vec4 shape = u_shapes[i];
                            float c = cos(shape.w);
                            float s = sin(shape.w);
                            vec2 local = mat2(c, -s, s, c)
                                * (point - shape.xy);
                            float outlineDistance = abs(
                                sdShape(KINDS[i], local, shape.z)
                            );
                            field = softMin(field, outlineDistance, 18.0);
                        }

                        float strokeAlpha = 1.0
                            - smoothstep(0.6, 1.6, field);
                        fragColor = vec4(
                            vec3(0.12, 0.12, 0.1),
                            strokeAlpha * 0.12
                        );
                    }
                `;

                function createShader(type, source) {
                    const shader = gl.createShader(type);
                    gl.shaderSource(shader, source);
                    gl.compileShader(shader);

                    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                        console.warn(gl.getShaderInfoLog(shader));
                        gl.deleteShader(shader);
                        return null;
                    }

                    return shader;
                }

                const vertexShader = createShader(
                    gl.VERTEX_SHADER,
                    vertexSource
                );
                const fragmentShader = createShader(
                    gl.FRAGMENT_SHADER,
                    fragmentSource
                );

                if (vertexShader && fragmentShader) {
                    const program = gl.createProgram();
                    gl.attachShader(program, vertexShader);
                    gl.attachShader(program, fragmentShader);
                    gl.linkProgram(program);
                    gl.deleteShader(vertexShader);
                    gl.deleteShader(fragmentShader);

                    if (gl.getProgramParameter(program, gl.LINK_STATUS)) {
                        glProgram = program;
                    } else {
                        console.warn(gl.getProgramInfoLog(program));
                        gl.deleteProgram(program);
                    }
                }

                if (glProgram) {
                    const positionLocation = gl.getAttribLocation(
                        glProgram,
                        "a_position"
                    );
                    shapesLocation = gl.getUniformLocation(
                        glProgram,
                        "u_shapes"
                    );
                    deviceScaleLocation = gl.getUniformLocation(
                        glProgram,
                        "u_deviceScale"
                    );

                    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
                    gl.bufferData(
                        gl.ARRAY_BUFFER,
                        new Float32Array([
                            -1, -1,
                             3, -1,
                            -1,  3
                        ]),
                        gl.STATIC_DRAW
                    );
                    gl.enableVertexAttribArray(positionLocation);
                    gl.vertexAttribPointer(
                        positionLocation,
                        2,
                        gl.FLOAT,
                        false,
                        0,
                        0
                    );
                    gl.useProgram(glProgram);
                    gl.clearColor(0, 0, 0, 0);
                }
            }

            if (!glProgram) {
                fallback = canvas.getContext("2d", { alpha: true });

                if (!fallback) {
                    canvas.remove();
                    return;
                }
            }

            const reducedMotion = window.matchMedia(
                "(prefers-reduced-motion: reduce)"
            );
            const startedAt = performance.now();
            const mouse = {
                x: 0,
                y: 0,
                targetX: 0,
                targetY: 0,
                strength: 0,
                targetStrength: 0
            };
            let animationFrame = null;
            let previousFrame = null;

            function deviceScale() {
                return Math.min(
                    2,
                    Math.max(1, window.devicePixelRatio || 1)
                );
            }

            function resize() {
                const width = window.innerWidth;
                const height = window.innerHeight;
                const scale = deviceScale();
                const nextWidth = Math.round(width * scale);
                const nextHeight = Math.round(height * scale);

                if (
                    canvas.width !== nextWidth
                    || canvas.height !== nextHeight
                ) {
                    canvas.width = nextWidth;
                    canvas.height = nextHeight;

                    if (glProgram) {
                        gl.viewport(0, 0, nextWidth, nextHeight);
                    }
                }

                if (fallback) {
                    fallback.setTransform(scale, 0, 0, scale, 0, 0);
                }
            }

            function draw(now) {
                const time = (now - startedAt) / 1000;
                const delta = Math.min(
                    (now - (previousFrame ?? now)) / 1000,
                    0.1
                );
                previousFrame = now;

                const positionEase = 1 - Math.exp(-delta * 5);
                const strengthEase = 1 - Math.exp(-delta * 2.5);
                mouse.x += (mouse.targetX - mouse.x) * positionEase;
                mouse.y += (mouse.targetY - mouse.y) * positionEase;
                mouse.strength += (mouse.targetStrength - mouse.strength)
                    * strengthEase;

                resize();

                const width = window.innerWidth;
                const height = window.innerHeight;

                const states = shapes.map((shape) => {
                    const parallax = shape.depth * 0.04 * mouse.strength;
                    return {
                        kind: shape.kind,
                        // Counter-clockwise on screen, in radians.
                        angle: shape.rot + 0.3 * Math.sin(
                            time * shape.sr * 0.8 + shape.phase * 1.7
                        ),
                        x: shape.x * width
                            + Math.sin(time * shape.sx + shape.phase)
                                * shape.drift * height
                            + (mouse.x - width * 0.5) * parallax,
                        y: shape.y * height
                            + Math.cos(
                                time * shape.sy + shape.phase * 1.3
                            ) * shape.drift * height
                            + (mouse.y - height * 0.5) * parallax,
                        r: shape.r * height * (
                            1 + 0.14 * Math.sin(
                                time * shape.sr + shape.phase * 2.1
                            )
                        )
                    };
                });

                if (glProgram) {
                    states.forEach((state, index) => {
                        shapeUniforms[index * 4] = state.x;
                        shapeUniforms[index * 4 + 1] = height - state.y;
                        shapeUniforms[index * 4 + 2] = state.r;
                        shapeUniforms[index * 4 + 3] = state.angle;
                    });
                    gl.clear(gl.COLOR_BUFFER_BIT);
                    gl.uniform4fv(shapesLocation, shapeUniforms);
                    gl.uniform1f(deviceScaleLocation, deviceScale());
                    gl.drawArrays(gl.TRIANGLES, 0, 3);
                } else {
                    fallback.clearRect(0, 0, width, height);
                    fallback.lineWidth = 2;
                    fallback.strokeStyle = inkColor;
                    states.forEach((state) => {
                        const r = state.r;
                        fallback.save();
                        fallback.translate(state.x, state.y);
                        fallback.rotate(-state.angle);
                        fallback.beginPath();

                        const corner = cornerRadius * r;

                        if (state.kind === "u") {
                            const top = -0.5 * (1 + uSide) * r;
                            const arcY = top + uSide * r;
                            fallback.moveTo(0, top);
                            fallback.arcTo(r, top, r, arcY, corner);
                            fallback.lineTo(r, arcY);
                            fallback.arc(0, arcY, r, 0, Math.PI);
                            fallback.arcTo(-r, top, 0, top, corner);
                            fallback.closePath();
                        } else if (state.kind === "triangle") {
                            const half = triangleHalf * r;
                            const apex = half * 2 / Math.sqrt(3);
                            fallback.moveTo(0, apex / 2);
                            fallback.arcTo(half, apex / 2, 0, -apex, corner);
                            fallback.arcTo(0, -apex, -half, apex / 2, corner);
                            fallback.arcTo(-half, apex / 2, 0, apex / 2, corner);
                            fallback.closePath();
                        } else {
                            fallback.arc(0, 0, r, 0, 2 * Math.PI);
                        }

                        fallback.stroke();
                        fallback.restore();
                    });
                }

                background.classList.add("is-rendered");
            }

            function animate(now) {
                draw(now);

                if (
                    !reducedMotion.matches
                    && document.visibilityState === "visible"
                ) {
                    animationFrame = requestAnimationFrame(animate);
                } else {
                    animationFrame = null;
                }
            }

            function start() {
                if (animationFrame === null) {
                    animationFrame = requestAnimationFrame(animate);
                }
            }

            function stop() {
                if (animationFrame !== null) {
                    cancelAnimationFrame(animationFrame);
                    animationFrame = null;
                }
            }

            reducedMotion.addEventListener("change", () => {
                stop();

                if (reducedMotion.matches) {
                    draw(performance.now());
                } else {
                    start();
                }
            });

            document.addEventListener("visibilitychange", () => {
                if (document.visibilityState === "visible") {
                    start();
                } else {
                    stop();
                }
            });

            window.addEventListener("pointermove", (event) => {
                mouse.targetX = event.clientX;
                mouse.targetY = event.clientY;
                mouse.targetStrength = 1;
            }, { passive: true });

            document.addEventListener("mouseleave", () => {
                mouse.targetStrength = 0;
            });

            window.addEventListener("resize", () => {
                draw(performance.now());
            }, { passive: true });

            mouse.x = window.innerWidth * 0.5;
            mouse.y = window.innerHeight * 0.5;
            mouse.targetX = mouse.x;
            mouse.targetY = mouse.y;

            start();
        })();
    </script>
</body>
</html>
