<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pencilsmith</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text x='50' y='75' font-size='80' text-anchor='middle' fill='%23222' font-family='serif'>P</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lustria&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            position: relative;
            min-height: 100svh;
            overflow: hidden;
            display: flex;
            align-items: center;
            padding: 30px 8%;
            isolation: isolate;
            color: #171713;
            background: #fafafa;
            font-family: "Lustria", serif;
        }

        .background {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .background canvas {
            display: block;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 1100ms ease;
        }

        .background.is-rendered canvas {
            opacity: 1;
        }

        main {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 960px;
            margin: auto;
        }

        h1 {
            font-size: clamp(36px, 5vw, 64px);
            line-height: 1;
            font-weight: 400;
        }

        p {
            margin-top: 6px;
            color: #6f6f69;
            font-size: clamp(12px, 1.3vw, 15px);
            line-height: 1.5;
            letter-spacing: 0.075em;
        }
    </style>
</head>
<body>
    <div class="background" aria-hidden="true">
        <canvas></canvas>
    </div>

    <main>
        <h1>Pencilsmith</h1>
        <p>Somewhere between minimal and zero.</p>
    </main>

    <script>
        (() => {
            const background = document.querySelector(".background");
            const canvas = background.querySelector("canvas");

            // x, y are viewport fractions; r and drift are fractions of
            // viewport height. sx / sy / sr are angular speeds in rad/s.
            const circles = [
                { x: 0.28, y: 0.25, r: 0.55, depth: 0.6,
                  drift: 0.055, sx: 0.14, sy: 0.11, sr: 0.09, phase: 0.0 },
                { x: 0.75, y: 0.35, r: 0.65, depth: 0.85,
                  drift: 0.065, sx: 0.12, sy: 0.15, sr: 0.11, phase: 1.7 },
                { x: 0.35, y: 0.80, r: 0.60, depth: 0.45,
                  drift: 0.060, sx: 0.10, sy: 0.13, sr: 0.08, phase: 3.1 },
                { x: 0.82, y: 0.78, r: 0.48, depth: 1.2,
                  drift: 0.075, sx: 0.16, sy: 0.12, sr: 0.10, phase: 5.6 },
                { x: 0.52, y: 0.55, r: 0.22, depth: 1.0,
                  drift: 0.070, sx: 0.15, sy: 0.14, sr: 0.12, phase: 4.2 }
            ];
            const circleCount = circles.length;
            const inkColor = "rgba(31, 31, 26, 0.18)";

            const gl = canvas.getContext("webgl2", {
                alpha: true,
                antialias: false,
                depth: false,
                powerPreference: "low-power",
                premultipliedAlpha: false
            });
            let glProgram = null;
            let circlesLocation = null;
            let deviceScaleLocation = null;
            let fallback = null;
            const circleUniforms = new Float32Array(circleCount * 3);

            if (gl) {
                const vertexSource = `#version 300 es
                    in vec2 a_position;

                    void main() {
                        gl_Position = vec4(a_position, 0.0, 1.0);
                    }
                `;

                const fragmentSource = `#version 300 es
                    precision highp float;

                    uniform vec3 u_circles[${circleCount}];
                    uniform float u_deviceScale;

                    out vec4 fragColor;

                    float softMin(float a, float b, float k) {
                        float h = clamp(
                            0.5 + 0.5 * (b - a) / k,
                            0.0,
                            1.0
                        );
                        return mix(b, a, h) - k * h * (1.0 - h);
                    }

                    void main() {
                        vec2 point = gl_FragCoord.xy / u_deviceScale;
                        float field = 1e6;

                        for (int i = 0; i < ${circleCount}; i++) {
                            float outlineDistance = abs(
                                length(point - u_circles[i].xy)
                                    - u_circles[i].z
                            );
                            field = softMin(field, outlineDistance, 18.0);
                        }

                        float strokeAlpha = 1.0
                            - smoothstep(0.6, 1.6, field);
                        fragColor = vec4(
                            vec3(0.12, 0.12, 0.1),
                            strokeAlpha * 0.18
                        );
                    }
                `;

                function createShader(type, source) {
                    const shader = gl.createShader(type);
                    gl.shaderSource(shader, source);
                    gl.compileShader(shader);

                    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                        console.warn(gl.getShaderInfoLog(shader));
                        gl.deleteShader(shader);
                        return null;
                    }

                    return shader;
                }

                const vertexShader = createShader(
                    gl.VERTEX_SHADER,
                    vertexSource
                );
                const fragmentShader = createShader(
                    gl.FRAGMENT_SHADER,
                    fragmentSource
                );

                if (vertexShader && fragmentShader) {
                    const program = gl.createProgram();
                    gl.attachShader(program, vertexShader);
                    gl.attachShader(program, fragmentShader);
                    gl.linkProgram(program);
                    gl.deleteShader(vertexShader);
                    gl.deleteShader(fragmentShader);

                    if (gl.getProgramParameter(program, gl.LINK_STATUS)) {
                        glProgram = program;
                    } else {
                        console.warn(gl.getProgramInfoLog(program));
                        gl.deleteProgram(program);
                    }
                }

                if (glProgram) {
                    const positionLocation = gl.getAttribLocation(
                        glProgram,
                        "a_position"
                    );
                    circlesLocation = gl.getUniformLocation(
                        glProgram,
                        "u_circles"
                    );
                    deviceScaleLocation = gl.getUniformLocation(
                        glProgram,
                        "u_deviceScale"
                    );

                    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
                    gl.bufferData(
                        gl.ARRAY_BUFFER,
                        new Float32Array([
                            -1, -1,
                             3, -1,
                            -1,  3
                        ]),
                        gl.STATIC_DRAW
                    );
                    gl.enableVertexAttribArray(positionLocation);
                    gl.vertexAttribPointer(
                        positionLocation,
                        2,
                        gl.FLOAT,
                        false,
                        0,
                        0
                    );
                    gl.useProgram(glProgram);
                    gl.clearColor(0, 0, 0, 0);
                }
            }

            if (!glProgram) {
                fallback = canvas.getContext("2d", { alpha: true });

                if (!fallback) {
                    canvas.remove();
                    return;
                }
            }

            const reducedMotion = window.matchMedia(
                "(prefers-reduced-motion: reduce)"
            );
            const startedAt = performance.now();
            const mouse = {
                x: 0,
                y: 0,
                targetX: 0,
                targetY: 0,
                strength: 0,
                targetStrength: 0
            };
            let animationFrame = null;
            let previousFrame = null;

            function deviceScale() {
                return Math.min(
                    2,
                    Math.max(1, window.devicePixelRatio || 1)
                );
            }

            function resize() {
                const width = window.innerWidth;
                const height = window.innerHeight;
                const scale = deviceScale();
                const nextWidth = Math.round(width * scale);
                const nextHeight = Math.round(height * scale);

                if (
                    canvas.width !== nextWidth
                    || canvas.height !== nextHeight
                ) {
                    canvas.width = nextWidth;
                    canvas.height = nextHeight;

                    if (glProgram) {
                        gl.viewport(0, 0, nextWidth, nextHeight);
                    }
                }

                if (fallback) {
                    fallback.setTransform(scale, 0, 0, scale, 0, 0);
                }
            }

            function draw(now) {
                const time = (now - startedAt) / 1000;
                const delta = Math.min(
                    (now - (previousFrame ?? now)) / 1000,
                    0.1
                );
                previousFrame = now;

                const positionEase = 1 - Math.exp(-delta * 5);
                const strengthEase = 1 - Math.exp(-delta * 2.5);
                mouse.x += (mouse.targetX - mouse.x) * positionEase;
                mouse.y += (mouse.targetY - mouse.y) * positionEase;
                mouse.strength += (mouse.targetStrength - mouse.strength)
                    * strengthEase;

                resize();

                const width = window.innerWidth;
                const height = window.innerHeight;

                const states = circles.map((circle) => {
                    const parallax = circle.depth * 0.04 * mouse.strength;
                    return {
                        x: circle.x * width
                            + Math.sin(time * circle.sx + circle.phase)
                                * circle.drift * height
                            + (mouse.x - width * 0.5) * parallax,
                        y: circle.y * height
                            + Math.cos(
                                time * circle.sy + circle.phase * 1.3
                            ) * circle.drift * height
                            + (mouse.y - height * 0.5) * parallax,
                        r: circle.r * height * (
                            1 + 0.14 * Math.sin(
                                time * circle.sr + circle.phase * 2.1
                            )
                        )
                    };
                });

                if (glProgram) {
                    states.forEach((state, index) => {
                        circleUniforms[index * 3] = state.x;
                        circleUniforms[index * 3 + 1] = height - state.y;
                        circleUniforms[index * 3 + 2] = state.r;
                    });
                    gl.clear(gl.COLOR_BUFFER_BIT);
                    gl.uniform3fv(circlesLocation, circleUniforms);
                    gl.uniform1f(deviceScaleLocation, deviceScale());
                    gl.drawArrays(gl.TRIANGLES, 0, 3);
                } else {
                    fallback.clearRect(0, 0, width, height);
                    fallback.lineWidth = 2;
                    fallback.strokeStyle = inkColor;
                    states.forEach((state) => {
                        fallback.beginPath();
                        fallback.arc(
                            state.x, state.y, state.r, 0, 2 * Math.PI
                        );
                        fallback.stroke();
                    });
                }

                background.classList.add("is-rendered");
            }

            function animate(now) {
                draw(now);

                if (
                    !reducedMotion.matches
                    && document.visibilityState === "visible"
                ) {
                    animationFrame = requestAnimationFrame(animate);
                } else {
                    animationFrame = null;
                }
            }

            function start() {
                if (animationFrame === null) {
                    animationFrame = requestAnimationFrame(animate);
                }
            }

            function stop() {
                if (animationFrame !== null) {
                    cancelAnimationFrame(animationFrame);
                    animationFrame = null;
                }
            }

            reducedMotion.addEventListener("change", () => {
                stop();

                if (reducedMotion.matches) {
                    draw(performance.now());
                } else {
                    start();
                }
            });

            document.addEventListener("visibilitychange", () => {
                if (document.visibilityState === "visible") {
                    start();
                } else {
                    stop();
                }
            });

            window.addEventListener("pointermove", (event) => {
                mouse.targetX = event.clientX;
                mouse.targetY = event.clientY;
                mouse.targetStrength = 1;
            }, { passive: true });

            document.addEventListener("mouseleave", () => {
                mouse.targetStrength = 0;
            });

            window.addEventListener("resize", () => {
                draw(performance.now());
            }, { passive: true });

            mouse.x = window.innerWidth * 0.5;
            mouse.y = window.innerHeight * 0.5;
            mouse.targetX = mouse.x;
            mouse.targetY = mouse.y;

            start();
        })();
    </script>
</body>
</html>
